<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Source Multi-Model Chat</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial; margin: 0; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(0,0,0,.1); position: sticky; top: 0; background: rgba(250,250,250,.7); backdrop-filter: blur(12px); }
    main { display: grid; grid-template-columns: 320px 1fr; gap: 1px; min-height: calc(100vh - 60px); }
    aside { padding: 1rem; border-right: 1px solid rgba(0,0,0,.1); }
    .content { display: grid; grid-template-rows: 1fr auto; height: calc(100vh - 60px); }
    .messages { padding: 1rem; overflow: auto; }
    .msg { max-width: 820px; white-space: pre-wrap; line-height: 1.6; }
    .msg.user { background: rgba(37,99,235,.08); border: 1px solid rgba(37,99,235,.2); padding: .75rem; border-radius: .75rem; margin: .5rem 0; }
    .msg.assistant { background: rgba(0,0,0,.04); border: 1px solid rgba(0,0,0,.1); padding: .75rem; border-radius: .75rem; margin: .5rem 0; }
    form { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid rgba(0,0,0,.1); }
    textarea { flex: 1; resize: vertical; min-height: 50px; max-height: 240px; padding: .75rem; border-radius: .5rem; border: 1px solid rgba(0,0,0,.2); }
    select, button, input { padding: .5rem .6rem; border-radius: .5rem; border: 1px solid rgba(0,0,0,.2); background: transparent; }
    .row { display: grid; grid-template-columns: 1fr; gap: .5rem; margin-bottom: .75rem; }
    label { font-size: .875rem; opacity: .8; display: block; margin-bottom: .25rem; }
    small { opacity: .7; }
    .muted { opacity: .7; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 999px; border: 1px solid rgba(0,0,0,.2); font-size: .75rem; }
  </style>
</head>
<body>
  <header>
    <strong>Open Source Multi-Model Chat</strong>
    <span class="badge">No sign-in</span>
    <span class="muted">Server holds provider API keys</span>
  </header>
  <main>
    <aside>
      <div class="row">
        <label for="provider">Provider</label>
        <select id="provider"></select>
      </div>
      <div class="row">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>
      <div class="row">
        <label for="system">System prompt</label>
        <textarea id="system" placeholder="You are a helpful AI assistant."></textarea>
      </div>
      <div class="two">
        <div>
          <label for="temp">Temperature</label>
          <input id="temp" type="number" min="0" max="2" step="0.1" value="0.7" />
        </div>
        <div>
          <label for="maxtok">Max tokens</label>
          <input id="maxtok" type="number" min="1" step="1" placeholder="1024" />
        </div>
      </div>
      <small class="muted">This client sends requests to /api/chat on the same origin. Configure provider API keys in your deployment environment. Keys are never exposed to the browser.</small>
    </aside>
    <section class="content">
      <div id="messages" class="messages"></div>
      <form id="chat">
        <textarea id="input" placeholder="Ask anything..." required></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </section>
  </main>
  <script>
    const state = { messages: [], providers: [], currentProvider: null, currentModel: null, streaming: false, controller: null };

    async function loadProviders() {
      const res = await fetch('/api/models');
      const data = await res.json();
      state.providers = data.providers || [];
      const providerSel = document.getElementById('provider');
      providerSel.innerHTML = '';
      for (const p of state.providers) {
        const opt = document.createElement('option');
        opt.value = p.id; opt.textContent = p.name; providerSel.appendChild(opt);
      }
      state.currentProvider = state.providers[0]?.id || '';
      populateModels();
    }

    function populateModels() {
      const p = state.providers.find(x => x.id === state.currentProvider);
      const modelSel = document.getElementById('model');
      modelSel.innerHTML = '';
      if (!p) return;
      for (const m of p.models) {
        const opt = document.createElement('option');
        opt.value = m.id; opt.textContent = m.name; modelSel.appendChild(opt);
      }
      state.currentModel = p.models[0]?.id || '';
    }

    function render() {
      const box = document.getElementById('messages');
      box.innerHTML = '';
      for (const m of state.messages) {
        const div = document.createElement('div');
        div.className = 'msg ' + m.role;
        div.textContent = m.content;
        box.appendChild(div);
      }
      box.scrollTop = box.scrollHeight;
    }

    async function sendChat(text) {
      const system = document.getElementById('system').value.trim();
      const temperature = parseFloat(document.getElementById('temp').value || '0.7');
      const max_tokens = parseInt(document.getElementById('maxtok').value || '0');
      const provider = state.currentProvider;
      const model = state.currentModel;

      if (system) state.messages.push({ role: 'system', content: system });
      state.messages.push({ role: 'user', content: text });
      state.messages.push({ role: 'assistant', content: '' });
      render();

      const controller = new AbortController();
      state.controller = controller; state.streaming = true;

      const payload = {
        provider, model, temperature, stream: true,
        messages: state.messages.filter((_, i) => !(system && i === 0)),
      };
      if (!isNaN(max_tokens) && max_tokens > 0) payload.max_tokens = max_tokens;

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal,
      });

      const ct = res.headers.get('content-type') || '';
      if (ct.includes('text/event-stream')) {
        await readSSE(res);
      } else {
        const data = await res.json().catch(()=>({text:''}));
        const last = state.messages[state.messages.length - 1];
        last.content = (data && data.text) ? data.text : last.content;
        state.streaming = false; state.controller = null; render();
      }
    }

    async function readSSE(res) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      const last = state.messages[state.messages.length - 1];

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';
        for (const line of lines) {
          if (!line.startsWith('data:')) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') { state.streaming = false; state.controller = null; render(); return; }
          try {
            const json = JSON.parse(data);
            const token = json.choices?.[0]?.delta?.content || json.choices?.[0]?.message?.content || '';
            if (token) { last.content += token; }
          } catch {}
        }
        render();
      }
      state.streaming = false; state.controller = null; render();
    }

    document.getElementById('provider').addEventListener('change', (e) => { state.currentProvider = e.target.value; populateModels(); });
    document.getElementById('model').addEventListener('change', (e) => { state.currentModel = e.target.value; });

    document.getElementById('chat').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (state.streaming) return;
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await sendChat(text);
    });

    loadProviders();
  </script>
</body>
</html>
